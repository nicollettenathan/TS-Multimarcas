<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veículo — TS Multimarcas</title><link rel="icon" type="image/svg+xml" href="logo-ts.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="vehicles.js"></script><style>:root{--bg:#050505;--panel:#101010;--line:#2a2a2a;--gold:#d6a334;--gold2:#f3c75b;--muted:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#181108 0,#050505 35%);color:#fff;font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,94vw);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.brand{display:flex;align-items:center;gap:12px}.brand img{width:68px;height:68px;object-fit:contain}.brand b{font-size:20px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);border-radius:9px;padding:11px 15px;font-weight:800}.btn.gold{background:linear-gradient(135deg,#efc154,#c78c1c);color:#100b02;border:0}.back{color:#d7c18d;font-size:13px}.content{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;padding:18px 0 56px}.panel{background:rgba(15,15,15,.97);border:1px solid var(--line);border-radius:16px;padding:18px}.main-photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#171717}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}.thumbs img{width:100%;aspect-ratio:1.35;object-fit:cover;border-radius:8px;border:1px solid #333;cursor:pointer}.thumbs img.active{border-color:var(--gold)}h1{margin:8px 0 4px;font-size:30px}.meta{color:var(--muted);line-height:1.6}.price-old{color:#888;text-decoration:line-through;margin-top:18px}.price{font-size:30px;font-weight:900;color:var(--gold2);margin:4px 0}.offer{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--gold);color:#111;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.spec{border:1px solid #292929;background:#0a0a0a;border-radius:10px;padding:12px}.spec small{display:block;color:#888;margin-bottom:4px}.spec b{font-size:14px}.desc{color:#ccc;line-height:1.65;white-space:pre-wrap}.empty{padding:70px 0;text-align:center;color:#aaa}@media(max-width:850px){.content{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start}.brand b{font-size:17px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}h1{font-size:24px}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html"><img src="logo-ts.svg" alt="TS Multimarcas"><b>TS Multimarcas</b></a><a class="btn" href="estoque.html">Voltar ao estoque</a></header><main id="app"><div class="empty">Carregando veículo...</div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');if(!id){app.innerHTML='<div class="empty">Veículo não encontrado.</div>';return}try{const all=await TSVehicles.list();const v=all.find(x=>String(x.id)===String(id));if(!v){app.innerHTML='<div class="empty">Este veículo não está disponível no momento.</div>';return}document.title=`${v.name||'Veículo'} — TS Multimarcas`;const imgs=Array.isArray(v.images)&&v.images.length?v.images:(v.image?[v.image]:[]);const specs=[['Marca',v.brand],['Modelo',v.model],['Versão',v.version],['Ano',v.model_year&&v.year!==v.model_year?`${v.year}/${v.model_year}`:(v.year||v.model_year)],['Quilometragem',v.km],['Câmbio',v.transmission],['Combustível',v.fuel],['Cor',v.color]].filter(x=>x[1]);const price=v.promo_price?`<div class="price-old">${esc(v.price)}</div><div class="price">${esc(v.promo_price)}</div><span class="offer">OFERTA</span>`:`<div class="price">${esc(v.price)}</div>`;app.innerHTML=`<div class="content"><section class="panel"><img id="mainPhoto" class="main-photo" src="${esc(imgs[0]||'logo-ts.svg')}" alt="${esc(v.name||'Veículo')}"><div class="thumbs">${imgs.map((u,i)=>`<img src="${esc(u)}" data-photo="${i}" class="${i===0?'active':''}">`).join('')}</div></section><aside class="panel"><div class="back">VEÍCULO DISPONÍVEL</div><h1>${esc(v.name||'')}</h1><div class="meta">${esc([v.year,v.model_year,v.km].filter(Boolean).join(' • '))}</div>${price}<div class="grid">${specs.map(([k,val])=>`<div class="spec"><small>${esc(k)}</small><b>${esc(val)}</b></div>`).join('')}</div>${v.description?`<h3>Sobre o veículo</h3><div class="desc">${esc(v.description)}</div>`:''}<div style="margin-top:22px"><a class="btn gold" href="index.html#contato">TENHO INTERESSE</a></div></aside></div>`;document.querySelectorAll('[data-photo]').forEach(t=>t.onclick=()=>{document.getElementById('mainPhoto').src=t.src;document.querySelectorAll('[data-photo]').forEach(x=>x.classList.remove('active'));t.classList.add('active')})}catch(e){app.innerHTML='<div class="empty">Não foi possível carregar este veículo agora.</div>';console.error(e)}}init();</script></body></html>
