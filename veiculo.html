<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veículo — TS Multimarcas</title><meta name="description" content="Detalhes do veículo na TS Multimarcas."><link rel="icon" type="image/svg+xml" href="/logo-ts.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/vehicles.js"></script><style>:root{--bg:#050505;--panel:#101010;--line:#2a2a2a;--gold:#d6a334;--gold2:#f3c75b;--muted:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#181108 0,#050505 35%);color:#fff;font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,94vw);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.brand{display:flex;align-items:center;gap:12px}.brand img{width:68px;height:68px;object-fit:contain}.brand b{font-size:20px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#090909;color:#fff}.btn.gold{background:linear-gradient(135deg,#efc154,#c78c1c);color:#100b02;border:0}.content{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;padding:18px 0 42px}.panel{background:rgba(15,15,15,.97);border:1px solid var(--line);border-radius:16px;padding:18px}.photo-wrap{position:relative}.main-photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#171717;cursor:zoom-in}.nav-photo{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid #ffffff44;background:#000b;color:#fff;font-size:20px;cursor:pointer}.nav-photo.prev{left:10px}.nav-photo.next{right:10px}.photo-count{position:absolute;right:10px;bottom:10px;background:#000c;border:1px solid #ffffff33;padding:5px 9px;border-radius:999px;font-size:11px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}.thumbs img{width:100%;aspect-ratio:1.35;object-fit:cover;border-radius:8px;border:1px solid #333;cursor:pointer}.thumbs img.active{border-color:var(--gold)}h1{margin:8px 0 4px;font-size:30px}.meta{color:var(--muted);line-height:1.6}.price-old{color:#888;text-decoration:line-through;margin-top:18px}.price{font-size:30px;font-weight:900;color:var(--gold2);margin:4px 0}.offer{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--gold);color:#111;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.spec{border:1px solid #292929;background:#0a0a0a;border-radius:10px;padding:12px}.spec small{display:block;color:#888;margin-bottom:4px}.spec b{font-size:14px}.desc{color:#ccc;line-height:1.65;white-space:pre-wrap}.empty{padding:70px 0;text-align:center;color:#aaa}.vehicle-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.related{padding:0 0 60px}.related h2{font-size:22px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related-grid .car{border:1px solid #292929;border-radius:12px;overflow:hidden;background:#0b0b0b}.related-grid .car>img{width:100%;aspect-ratio:16/10;object-fit:cover}.related-grid .car-body{padding:13px}.related-grid h3{font-size:15px;margin:0 0 6px}.related-grid .price{font-size:18px}.related-grid .btn{font-size:11px;padding:8px 10px;margin-top:8px}.lightbox{position:fixed;inset:0;background:#000e;z-index:99;display:none;align-items:center;justify-content:center;padding:25px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:20px;top:20px;background:#111;color:#fff;border:1px solid #555;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}@media(max-width:850px){.content{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start}.brand b{font-size:17px}.related-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}h1{font-size:24px}.related-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/index.html"><img src="/logo-ts.svg" alt="TS Multimarcas"><b>TS Multimarcas</b></a><a class="btn" href="/estoque.html">Voltar ao estoque</a></header><main id="app"><div class="empty">Carregando veículo...</div></main><section id="related" class="related"></section></div><div id="lightbox" class="lightbox"><button id="closeLightbox">×</button><img id="lightboxImg" alt="Foto ampliada"></div><script>let currentVehicle=null,currentImages=[],photoIndex=0;const app=document.getElementById('app'),related=document.getElementById('related'),esc=TSVehicles.esc;function setPhoto(i){if(!currentImages.length)return;photoIndex=(i+currentImages.length)%currentImages.length;document.getElementById('mainPhoto').src=currentImages[photoIndex];document.getElementById('photoCount').textContent=`${photoIndex+1}/${currentImages.length}`;document.querySelectorAll('[data-photo]').forEach((x,n)=>x.classList.toggle('active',n===photoIndex))}function trackView(v){const key=`ts-view-${v.id}-${new Date().toISOString().slice(0,10)}`;if(!localStorage.getItem(key)){localStorage.setItem(key,'1');TSVehicles.track(v.id,'view')}}async function shareVehicle(){const data={title:currentVehicle.name,text:`Confira este ${currentVehicle.name} na TS Multimarcas`,url:location.href};if(navigator.share){try{await navigator.share(data);return}catch{}}await navigator.clipboard.writeText(location.href);alert('Link copiado!')}async function init(){const qs=new URLSearchParams(location.search),slug=qs.get('slug'),id=qs.get('id');if(!slug&&!id){app.innerHTML='<div class="empty">Veículo não encontrado.</div>';return}try{const all=await TSVehicles.list(),v=all.find(x=>(slug&&x.slug===slug)||(id&&String(x.id)===String(id)));if(!v||v.status==='arquivado'){app.innerHTML='<div class="empty">Este veículo não está disponível no momento.</div>';return}currentVehicle=v;currentImages=Array.isArray(v.images)&&v.images.length?v.images:(v.image?[v.image]:[]);document.title=`${v.name||'Veículo'} — TS Multimarcas`;document.querySelector('meta[name="description"]').content=`${v.name||'Veículo'} na TS Multimarcas. Confira fotos, detalhes e condições.`;const specs=[['Marca',v.brand],['Modelo',v.model],['Versão',v.version],['Ano',v.model_year&&v.year!==v.model_year?`${v.year}/${v.model_year}`:(v.year||v.model_year)],['Quilometragem',v.km],['Câmbio',v.transmission],['Combustível',v.fuel],['Cor',v.color]].filter(x=>x[1]);app.innerHTML=`<div class="content"><section class="panel"><div class="photo-wrap"><img id="mainPhoto" class="main-photo" src="${esc(currentImages[0]||'/logo-ts.svg')}" alt="${esc(v.name||'Veículo')}">${currentImages.length>1?'<button class="nav-photo prev" id="prevPhoto">‹</button><button class="nav-photo next" id="nextPhoto">›</button>':''}<span class="photo-count" id="photoCount">1/${Math.max(1,currentImages.length)}</span></div><div class="thumbs">${currentImages.map((u,i)=>`<img loading="lazy" src="${esc(u)}" data-photo="${i}" class="${i===0?'active':''}" alt="${esc(v.name)} — foto ${i+1}">`).join('')}</div></section><aside class="panel"><div class="meta">${v.status==='vendido'?'VEÍCULO VENDIDO':'VEÍCULO DISPONÍVEL'}</div><h1>${esc(v.name||'')}</h1><div class="meta">${esc([v.year,v.model_year,v.km].filter(Boolean).join(' • '))}</div>${TSVehicles.priceHtml(v)}<div class="grid">${specs.map(([k,val])=>`<div class="spec"><small>${esc(k)}</small><b>${esc(val)}</b></div>`).join('')}</div>${v.description?`<h3>Sobre o veículo</h3><div class="desc">${esc(v.description)}</div>`:''}<div class="vehicle-actions">${v.status==='vendido'?'':`<a class="btn gold" id="interestBtn" href="/index.html#contato">TENHO INTERESSE</a>`}<button class="btn" id="shareBtn">COMPARTILHAR</button></div></aside></div>`;document.querySelectorAll('[data-photo]').forEach(t=>t.onclick=()=>setPhoto(Number(t.dataset.photo)));document.getElementById('prevPhoto')?.addEventListener('click',()=>setPhoto(photoIndex-1));document.getElementById('nextPhoto')?.addEventListener('click',()=>setPhoto(photoIndex+1));document.getElementById('shareBtn').onclick=shareVehicle;document.getElementById('interestBtn')?.addEventListener('click',()=>TSVehicles.track(v.id,'whatsapp'));document.getElementById('mainPhoto').onclick=()=>{document.getElementById('lightboxImg').src=currentImages[photoIndex]||'/logo-ts.svg';document.getElementById('lightbox').classList.add('open')};trackView(v);const suggestions=all.filter(x=>x.status==='disponivel'&&String(x.id)!==String(v.id)).slice(0,3);related.innerHTML=suggestions.length?`<h2>Você também pode gostar</h2><div class="related-grid">${suggestions.map(TSVehicles.card).join('')}</div>`:''}catch(e){app.innerHTML='<div class="empty">Não foi possível carregar este veículo agora.</div>';console.error(e)}}document.getElementById('closeLightbox').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};init();</script></body></html>
