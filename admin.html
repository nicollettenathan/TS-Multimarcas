<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — TS Multimarcas</title><link rel="icon" type="image/svg+xml" href="logo-ts.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="vehicles.js"></script><style>:root{--bg:#070707;--panel:#101010;--line:#3a2b0e;--gold:#d7a638;--gold2:#f0c65c;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1180px,94vw);margin:auto;padding:26px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:74px;height:74px;object-fit:contain}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--gold);background:#0c0c0c;color:#fff;padding:12px 16px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none}.btn.gold{background:linear-gradient(135deg,#efc45b,#c99528);color:#130d02;border:0}.btn.danger{border-color:#7b2929;color:#ffb8b8}.notice{border:1px solid #684d17;background:#151006;padding:15px 17px;border-radius:12px;margin-bottom:20px;color:#e8cf93;line-height:1.5}.layout{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:var(--panel);border:1px solid #272727;border-radius:14px;padding:20px}.panel h2{margin-top:0}.field{width:100%;background:#090909;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:6px 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:flex;gap:16px;margin:4px 0 16px;font-size:13px;color:#ddd}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;border:1px solid #2a2a2a;background:#0b0b0b;border-radius:10px;padding:10px}.item img{width:110px;height:78px;object-fit:cover;border-radius:8px;background:#222}.item h3{margin:0 0 5px;font-size:15px}.item p{margin:0;color:#aaa;font-size:12px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:8px 10px;font-size:11px}.status{color:var(--gold2);font-weight:800}.login{max-width:420px;margin:80px auto}.hidden{display:none!important}.login-actions{display:flex;gap:8px;flex-wrap:wrap}.warn{color:#ffcf72}@media(max-width:850px){.layout{grid-template-columns:1fr}.item{grid-template-columns:90px 1fr}.item img{width:90px}.actions{grid-column:1/-1;justify-content:flex-start}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="logo-ts.svg" alt="TS"><div><h1>Painel TS Multimarcas</h1><p>Gestão protegida do estoque</p></div></div><div><a class="btn" href="index.html">Ver site</a> <button class="btn hidden" id="logout">Sair</button></div></div><div class="notice" id="modeNotice"></div><section id="loginBox" class="panel login hidden"><h2>Acesso administrativo</h2><input class="field" id="email" type="email" autocomplete="email" placeholder="E-mail"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Senha"><div class="login-actions"><button class="btn gold" id="loginBtn">ENTRAR</button><button class="btn" id="signupBtn">CRIAR PRIMEIRO ACESSO</button></div><p id="loginMsg" style="color:#aaa;font-size:13px;line-height:1.5"></p></section><section id="deniedBox" class="panel login hidden"><h2>Acesso não liberado</h2><p class="warn">Sua conta existe, mas ainda não possui permissão de administrador.</p><button class="btn" id="deniedLogout">Sair</button></section><div id="app" class="layout hidden"><section class="panel"><h2 id="formTitle">Adicionar veículo</h2><input type="hidden" id="vid"><label>Nome / modelo</label><input class="field" id="name" placeholder="Ex.: Toyota Corolla XEi 2.0"><div class="row"><div><label>Ano</label><input class="field" id="year" placeholder="2022/2023"></div><div><label>Quilometragem</label><input class="field" id="km" placeholder="28.000 km"></div></div><div class="row"><div><label>Câmbio</label><input class="field" id="transmission" placeholder="Automático"></div><div><label>Preço</label><input class="field" id="price" placeholder="R$ 119.900"></div></div><label>URL da foto</label><input class="field" id="image" placeholder="https://..."><label>Status</label><select class="field" id="status"><option value="disponivel">Disponível</option><option value="vendido">Vendido</option><option value="arquivado">Arquivado</option></select><div class="checks"><label><input type="checkbox" id="featured"> Destaque na Home</label></div><button class="btn gold" id="save">SALVAR VEÍCULO</button> <button class="btn hidden" id="cancel">Cancelar edição</button></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><h2>Veículos cadastrados</h2><span id="count" class="status"></span></div><div class="list" id="vehicleList"></div></section></div></div><script>const $=id=>document.getElementById(id);let sb=null;let items=[];const configured=TSVehicles.configured();$('modeNotice').innerHTML=configured?'Supabase conectado. O estoque está protegido por login e regras de acesso.':'<b>Configuração pendente.</b> Falta inserir a URL e a chave pública do Supabase em <code>supabase-config.js</code>. Enquanto isso o painel permanece em modo demonstração local.';if(configured){sb=TSVehicles.client();startAuth()}else{showApp();load()}async function isAdmin(){const {data,error}=await sb.rpc('is_current_user_admin');return !error&&data===true}async function startAuth(){const {data}=await sb.auth.getUser();if(data&&data.user){await enterIfAuthorized()}else{$('loginBox').classList.remove('hidden')}}async function enterIfAuthorized(){if(await isAdmin()){$('loginBox').classList.add('hidden');$('deniedBox').classList.add('hidden');showApp();load()}else{$('loginBox').classList.add('hidden');$('deniedBox').classList.remove('hidden')}}$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;const {error}=await sb.auth.signInWithPassword({email,password});$('loginMsg').textContent=error?error.message:'';if(!error)await enterIfAuthorized()};$('signupBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8){$('loginMsg').textContent='Informe um e-mail válido e uma senha com pelo menos 8 caracteres.';return}const {error}=await sb.auth.signUp({email,password});$('loginMsg').textContent=error?error.message:'Conta criada. Confirme o e-mail se o Supabase solicitar. Depois esta conta precisa ser liberada como administradora.'};async function logout(){if(sb)await sb.auth.signOut();location.reload()}$('logout').onclick=logout;$('deniedLogout').onclick=logout;function showApp(){$('app').classList.remove('hidden');if(configured)$('logout').classList.remove('hidden')}async function load(){items=await TSVehicles.list();render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){$('count').textContent=items.length+' veículos';$('vehicleList').innerHTML=items.map(v=>`<div class="item"><img src="${esc(v.image)}" alt=""><div><h3>${esc(v.name)}</h3><p>${esc(v.year)} • ${esc(v.km)}<br>${esc(v.price)} • <span class="status">${esc(v.status||'disponivel')}</span>${v.featured?' • Destaque':''}</p></div><div class="actions"><button class="btn small" onclick="editV('${v.id}')">Editar</button><button class="btn small danger" onclick="removeV('${v.id}')">Excluir</button></div></div>`).join('')||'<p style="color:#aaa">Nenhum veículo cadastrado.</p>'}function dataFromForm(){return{name:$('name').value.trim(),year:$('year').value.trim(),km:$('km').value.trim(),transmission:$('transmission').value.trim(),price:$('price').value.trim(),image:$('image').value.trim(),status:$('status').value,featured:$('featured').checked}}$('save').onclick=async()=>{const data=dataFromForm();if(!data.name||!data.price){alert('Preencha pelo menos nome e preço.');return}const id=$('vid').value;if(configured){const r=id?await sb.from('vehicles').update(data).eq('id',id):await sb.from('vehicles').insert(data);if(r.error){alert(r.error.message);return}}else{if(id){items=items.map(v=>v.id===id?{...v,...data}:v)}else{items.unshift({id:'local-'+Date.now(),...data,created_at:new Date().toISOString()})}localStorage.setItem('ts_admin_demo_vehicles',JSON.stringify(items))}clearForm();await load()};window.editV=id=>{const v=items.find(x=>String(x.id)===String(id));if(!v)return;$('vid').value=v.id;$('name').value=v.name||'';$('year').value=v.year||'';$('km').value=v.km||'';$('transmission').value=v.transmission||'';$('price').value=v.price||'';$('image').value=v.image||'';$('status').value=v.status||'disponivel';$('featured').checked=!!v.featured;$('formTitle').textContent='Editar veículo';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};window.removeV=async id=>{if(!confirm('Excluir este veículo?'))return;if(configured){const {error}=await sb.from('vehicles').delete().eq('id',id);if(error){alert(error.message);return}}else{items=items.filter(v=>String(v.id)!==String(id));localStorage.setItem('ts_admin_demo_vehicles',JSON.stringify(items))}await load()};function clearForm(){$('vid').value='';['name','year','km','transmission','price','image'].forEach(x=>$(x).value='');$('status').value='disponivel';$('featured').checked=false;$('formTitle').textContent='Adicionar veículo';$('cancel').classList.add('hidden')}$('cancel').onclick=clearForm;</script></body></html>
